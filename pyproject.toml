[project]
name = "living-terminal-profile"
version = "0.1.0"
description = "Locally generated, self-contained GitHub profile ('Living Terminal') for Sushant Nemade."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
