<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Option 3 Systems Console preview</title>
  <style>
    :root { font-family: "Segoe UI", sans-serif; color: #e8eef5; background: #05070a; }
    body { margin: 0; background: radial-gradient(circle at top, #151c26 0, #080b10 38%, #05070a 100%); }
    main { width: min(940px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 64px; }
    header { margin-bottom: 20px; }
    h1 { margin: 0; font-size: 26px; letter-spacing: 0; }
    p { margin: 8px 0 0; color: #8792a2; }
    img { display: block; width: 100%; height: auto; margin: 0 0 18px; }
    .label { margin: 30px 0 10px; color: #22d3ee; font: 700 12px Consolas, monospace; }
    @media (max-width: 520px) { main { width: min(100% - 16px, 940px); padding-top: 12px; } h1 { font-size: 21px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Systems Console / Option 3</h1>
      <p>Dark profile surfaces at their actual responsive widths.</p>
    </header>
    <div class="label">IDENTITY</div>
    <picture><source media="(max-width: 600px)" srcset="assets/terminal-hero-mobile.svg"><img src="assets/terminal-hero.svg" alt="Terminal hero preview"></picture>
    <div class="label">CAPABILITY DECK</div>
    <picture><source media="(max-width: 600px)" srcset="assets/capability-deck-mobile.svg"><img src="assets/capability-deck.svg" alt="Capability deck preview"></picture>
    <div class="label">DELIVERY ARCHITECTURE</div>
    <picture><source media="(max-width: 600px)" srcset="assets/system-architecture-mobile.svg"><img src="assets/system-architecture.svg" alt="Pseudo-3D architecture preview"></picture>
    <div class="label">SELECTED SYSTEMS</div>
    <picture><source media="(max-width: 600px)" srcset="assets/project-board-mobile.svg"><img src="assets/project-board.svg" alt="Selected work board preview"></picture>
  </main>
</body>
</html>
