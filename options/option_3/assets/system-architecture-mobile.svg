<svg xmlns="http://www.w3.org/2000/svg" role="img" width="100%" viewBox="0 0 390 690" preserveAspectRatio="xMidYMid meet"><title>Mobile pseudo-3D AI delivery architecture</title><desc>Mobile isometric five-stage delivery architecture with governance controls and a moving signal path.</desc><rect width="390" height="690" rx="8" fill="#080B10" stroke="#293241"/><path d="M1 46 H389" stroke="#293241"/><circle cx="20" cy="23" r="4" fill="#FB7185"/><circle cx="36" cy="23" r="4" fill="#FBBF24"/><circle cx="52" cy="23" r="4" fill="#34D399"/><style>.boot{opacity:1;animation:boot .45s ease-out both}.d1{animation-delay:.2s}.d2{animation-delay:.4s}.d3{animation-delay:.6s}.cursor{opacity:1;animation:blink 1.1s steps(2,end) infinite}.module{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}.m2{animation-delay:.5s}.m3{animation-delay:1s}.m4{animation-delay:1.5s}.m5{animation-delay:2s}.scan{animation:scan 7s linear infinite}.signal-core{transform-box:fill-box;transform-origin:center;animation:core-pulse 3.6s ease-in-out infinite}.signal-line{animation:signal-flow 4s linear infinite}.signal-node{transform-box:fill-box;transform-origin:center;animation:node-pulse 2.4s ease-in-out infinite}.n2{animation-delay:.6s}.n3{animation-delay:1.2s}.n4{animation-delay:1.8s}@keyframes boot{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes blink{50%{opacity:.15}}@keyframes breathe{0%,100%{opacity:.82}50%{opacity:1}}@keyframes scan{from{transform:translateY(0)}to{transform:translateY(430px)}}@keyframes core-pulse{0%,100%{opacity:.84}50%{opacity:1}}@keyframes signal-flow{to{stroke-dashoffset:-48}}@keyframes node-pulse{0%,100%{opacity:.45;transform:scale(.82)}50%{opacity:1;transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){.boot,.cursor,.module,.scan,.signal-core,.signal-line,.signal-node{animation:none}.moving{display:none}}</style><text x="76.0" y="28.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="400" fill="#8792A2" text-anchor="start">systems-console / architecture</text><text x="18.0" y="78.0" font-family="Consolas,Liberation Mono,monospace" font-size="11" font-weight="700" fill="#22D3EE" text-anchor="start">FROM AMBIGUITY TO ADOPTION</text><polygon points="22,510 195,215 368,510 195,650" fill="#0E131B" stroke="#293241"/><g class="module "><ellipse cx="67" cy="529" rx="35.0" ry="10" fill="#000000" fill-opacity=".3"/><polygon points="40.0,466.0 67.0,482.0 67.0,516.0 40.0,500.0" fill="#151C26" stroke="#293241"/><polygon points="67.0,482.0 94.0,466.0 94.0,500.0 67.0,516.0" fill="#0E131B" stroke="#293241"/><polygon points="40.0,466.0 67.0,450.0 94.0,466.0 67.0,482.0" fill="#22D3EE" fill-opacity=".72" stroke="#22D3EE"/><circle cx="67" cy="466" r="4" fill="#E8EEF5"/></g><text x="67.0" y="559.0" font-family="Consolas,Liberation Mono,monospace" font-size="11" font-weight="700" fill="#E8EEF5" text-anchor="middle">DISCOVER</text><g class="module m2"><ellipse cx="128" cy="452" rx="35.0" ry="10" fill="#000000" fill-opacity=".3"/><polygon points="101.0,380.0 128.0,396.0 128.0,439.0 101.0,423.0" fill="#151C26" stroke="#293241"/><polygon points="128.0,396.0 155.0,380.0 155.0,423.0 128.0,439.0" fill="#0E131B" stroke="#293241"/><polygon points="101.0,380.0 128.0,364.0 155.0,380.0 128.0,396.0" fill="#34D399" fill-opacity=".72" stroke="#34D399"/><circle cx="128" cy="380" r="4" fill="#E8EEF5"/></g><text x="128.0" y="482.0" font-family="Consolas,Liberation Mono,monospace" font-size="11" font-weight="700" fill="#E8EEF5" text-anchor="middle">EVALUATE</text><g class="module m3"><ellipse cx="195" cy="369" rx="35.0" ry="10" fill="#000000" fill-opacity=".3"/><polygon points="168.0,282.0 195.0,298.0 195.0,356.0 168.0,340.0" fill="#151C26" stroke="#293241"/><polygon points="195.0,298.0 222.0,282.0 222.0,340.0 195.0,356.0" fill="#0E131B" stroke="#293241"/><polygon points="168.0,282.0 195.0,266.0 222.0,282.0 195.0,298.0" fill="#FBBF24" fill-opacity=".72" stroke="#FBBF24"/><ci