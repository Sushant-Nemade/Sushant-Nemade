<svg xmlns="http://www.w3.org/2000/svg" role="img" width="100%" viewBox="0 0 390 720" preserveAspectRatio="xMidYMid meet"><title>Mobile Systems Console identity for Sushant Nemade</title><desc>Mobile dark terminal identity panel with the animated SN Signal Core and professional profile facts.</desc><rect width="390" height="720" rx="8" fill="#080B10" stroke="#293241"/><path d="M1 46 H389" stroke="#293241"/><circle cx="20" cy="23" r="4" fill="#FB7185"/><circle cx="36" cy="23" r="4" fill="#FBBF24"/><circle cx="52" cy="23" r="4" fill="#34D399"/><style>.boot{opacity:1;animation:boot .45s ease-out both}.d1{animation-delay:.2s}.d2{animation-delay:.4s}.d3{animation-delay:.6s}.cursor{opacity:1;animation:blink 1.1s steps(2,end) infinite}.module{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}.m2{animation-delay:.5s}.m3{animation-delay:1s}.m4{animation-delay:1.5s}.m5{animation-delay:2s}.scan{animation:scan 7s linear infinite}.signal-core{transform-box:fill-box;transform-origin:center;animation:core-pulse 3.6s ease-in-out infinite}.signal-line{animation:signal-flow 4s linear infinite}.signal-node{transform-box:fill-box;transform-origin:center;animation:node-pulse 2.4s ease-in-out infinite}.n2{animation-delay:.6s}.n3{animation-delay:1.2s}.n4{animation-delay:1.8s}@keyframes boot{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes blink{50%{opacity:.15}}@keyframes breathe{0%,100%{opacity:.82}50%{opacity:1}}@keyframes scan{from{transform:translateY(0)}to{transform:translateY(430px)}}@keyframes core-pulse{0%,100%{opacity:.84}50%{opacity:1}}@keyframes signal-flow{to{stroke-dashoffset:-48}}@keyframes node-pulse{0%,100%{opacity:.45;transform:scale(.82)}50%{opacity:1;transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){.boot,.cursor,.module,.scan,.signal-core,.signal-line,.signal-node{animation:none}.moving{display:none}}</style><text x="76.0" y="28.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="400" fill="#8792A2" text-anchor="start">systems-console / identity</text><rect x="44" y="66" width="302" height="286" rx="5" fill="#0E131B" stroke="#293241"/><g id="sn-signal-core" transform="translate(62.0 76.0) scale(1.1083)"><circle cx="120" cy="120" r="102" fill="none" stroke="#293241" stroke-dasharray="2 9"/><path d="M24 120 C24 56 216 56 216 120 C216 184 24 184 24 120 Z" fill="none" stroke="#22D3EE" stroke-opacity=".42" stroke-width="2"/><path d="M43 174 C82 210 184 198 211 126 C229 78 174 38 116 43 C62 47 31 85 43 174 Z" fill="none" stroke="#34D399" stroke-opacity=".34" stroke-width="2"/><path d="M49 81 C91 18 194 39 205 110 C215 177 129 218 69 178" fill="none" stroke="#FBBF24" stroke-opacity=".24" stroke-width="2" stroke-dasharray="7 9" class="signal-line"/><g class="signal-core"><polygon points="120,48 183,84 183,156 120,192 57,156 57,84" fill="#151C26" stroke="#22D3EE" stroke-width="2"/><polygon points="120,48 183,84 120,120 57,84" fill="#22D3EE" fill-opacity=".17" stroke="#293241"/><polygon points="57,84 120,120 120,192 57,156" fill="#34D399" fill-opacity=".10" stroke="#293241"/><polygon points="183,84 120,120 120,192 183,156" fill="#FBBF24" fill-opacity=".08" stroke="#293241"/><path d="M105 91 H79 V118 H105 V146 H78" fill="none" stroke="#22D3EE" stroke-width="8" stroke-linecap="square" stroke-linejoin="round"/><path d="M132 146 V91 L163 146 V91" fill="none" stroke="#34D399" stroke-width="8" stroke-linecap="square" stroke-linejoin="round"/></g><circle cx="120" cy="18" r="5" fill="#22D3EE" class="signal-node"/><circle cx="218" cy="120" r="5" fill="#34D399" class="signal-node n2"/><circle cx="120" cy="222" r="5" fill="#FBBF24" class="signal-node n3"/><circle cx="22" cy="120" r="5" fill="#FB7185" class="signal-node n4"/><circle r="4" fill="#22D3EE" class="moving"><animateMotion dur="9.0s" begin="0s" repeatCount="indefinite" path="M24 120 C24 56 216 56 216 120 C216 184 24 184 24 120 Z"/></circle><circle r="4" fill="#34D399" class="moving"><animateMotion dur="9.0s" begin="3.0s" repeatCount="indefinite" path="M24 120 C24 56 216 56 216 120 C216 184 24 184 24 120 Z"/></circle><circle r="4" fill="#FBBF24" class="moving"><animateMotion dur="9.0s" begin="6.0s" repeatCount="indefinite" path="M43 174 C82 210 184 198 211 126 C229 78 174 38 116 43 C62 47 31 85 43 174 Z"/></circle><text x="120.0" y="233.0" font-family="Consolas,Liberation Mono,monospace" font-size="8" font-weight="700" fill="#8792A2" text-anchor="middle">STRUCTURE / SIGNAL / SYSTEM</text></g><text x="22.0" y="388.0" font-family="Consolas,Liberation Mono,monospace" font-size="11" font-weight="400" fill="#34D399" text-anchor="start" class="boot">$ boot profile --mode professional</text><text x="22.0" y="430.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#E8EEF5" text-anchor="start" class="boot d1">Sushant Nemade</text><text x="22.0" y="462.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#22D3EE" text-anchor="start" class="boot d2">Enterprise GenAI / RAG / Analytics</text><text x="22.0" y="483.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#22D3EE" text-anchor="start" class="boot d2">Automation</text><path d="M22 503 H368" stroke="#293241"/><text x="22.0" y="535.0" font-family="Consolas,Liberation Mono,monospace" font-size="9" font-weight="700" fill="#8792A2" text-anchor="start" class="boot d1">LOCATION</text><text x="112.0" y="535.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="400" fill="#E8EEF5" text-anchor="start" class="boot d1">Erlangen, Germany</text><text x="22.0" y="566.0" font-family="Consolas,Liberation Mono,monospace" font-size="9" font-weight="700" fill="#8792A2" text-anchor="start" class="boot d2">EDUCATION</text><text x="112.0" y="566.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="400" fill="#E8EEF5" text-anchor="start" class="boot d2">M.