<svg xmlns="http://www.w3.org/2000/svg" role="img" width="100%" viewBox="0 0 900 290" preserveAspectRatio="xMidYMid meet"><title>Capability command deck</title><desc>Six verified capability groups from the profile configuration.</desc><rect width="900" height="290" rx="8" fill="#080B10" stroke="#293241"/><path d="M1 46 H899" stroke="#293241"/><circle cx="20" cy="23" r="4" fill="#FB7185"/><circle cx="36" cy="23" r="4" fill="#FBBF24"/><circle cx="52" cy="23" r="4" fill="#34D399"/><style>.boot{opacity:1;animation:boot .45s ease-out both}.d1{animation-delay:.2s}.d2{animation-delay:.4s}.d3{animation-delay:.6s}.cursor{opacity:1;animation:blink 1.1s steps(2,end) infinite}.module{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}.m2{animation-delay:.5s}.m3{animation-delay:1s}.m4{animation-delay:1.5s}.m5{animation-delay:2s}.scan{animation:scan 7s linear infinite}.signal-core{transform-box:fill-box;transform-origin:center;animation:core-pulse 3.6s ease-in-out infinite}.signal-line{animation:signal-flow 4s linear infinite}.signal-node{transform-box:fill-box;transform-origin:center;animation:node-pulse 2.4s ease-in-out infinite}.n2{animation-delay:.6s}.n3{animation-delay:1.2s}.n4{animation-delay:1.8s}@keyframes boot{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes blink{50%{opacity:.15}}@keyframes breathe{0%,100%{opacity:.82}50%{opacity:1}}@keyframes scan{from{transform:translateY(0)}to{transform:translateY(430px)}}@keyframes core-pulse{0%,100%{opacity:.84}50%{opacity:1}}@keyframes signal-flow{to{stroke-dashoffset:-48}}@keyframes node-pulse{0%,100%{opacity:.45;transform:scale(.82)}50%{opacity:1;transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){.boot,.cursor,.module,.scan,.signal-core,.signal-line,.signal-node{animation:none}.moving{display:none}}</style><text x="76.0" y="28.0" font-family="Consolas,Liberation Mono,monospace" font-size="11" font-weight="400" fill="#8792A2" text-anchor="start">syste