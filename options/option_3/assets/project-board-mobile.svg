<svg xmlns="http://www.w3.org/2000/svg" role="img" width="100%" viewBox="0 0 390 1080" preserveAspectRatio="xMidYMid meet"><title>Mobile selected work system board</title><desc>Four professional case studies arranged vertically for narrow screens.</desc><rect width="390" height="1080" rx="8" fill="#080B10" stroke="#293241"/><path d="M1 46 H389" stroke="#293241"/><circle cx="20" cy="23" r="4" fill="#FB7185"/><circle cx="36" cy="23" r="4" fill="#FBBF24"/><circle cx="52" cy="23" r="4" fill="#34D399"/><style>.boot{opacity:1;animation:boot .45s ease-out both}.d1{animation-delay:.2s}.d2{animation-delay:.4s}.d3{animation-delay:.6s}.cursor{opacity:1;animation:blink 1.1s steps(2,end) infinite}.module{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}.m2{animation-delay:.5s}.m3{animation-delay:1s}.m4{animation-delay:1.5s}.m5{animation-delay:2s}.scan{animation:scan 7s linear infinite}@keyframes boot{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes blink{50%{opacity:.15}}@keyframes breathe{0%,100%{opacity:.82}50%{opacity:1}}@keyframes scan{from{transform:translateY(0)}to{transform:translateY(430px)}}@media(prefers-reduced-motion:reduce){.boot,.cursor,.module,.scan{animation:none}.moving{display:none}}</style><text x="76.0" y="28.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="400" fill="#8792A2" text-anchor="start">systems-console / selected-work</text><rect x="18" y="62" width="354" height="226" rx="6" fill="#0E131B" stroke="#293241"/><path d="M18 110 H372" stroke="#293241"/><text x="34.0" y="91.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="700" fill="#22D3EE" text-anchor="start">CASE / 01</text><text x="354.0" y="91.0" font-family="Consolas,Liberation Mono,monospace" font-size="8" font-weight="400" fill="#8792A2" text-anchor="end">IN PREPARATION</text><text x="34.0" y="139.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#E8EEF5" text-anchor="start">Urban Change Detection and Change</text><text x="34.0" y="159.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#E8EEF5" text-anchor="start">Captioning</text><text x="34.0" y="189.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8792A2" text-anchor="start">Designed and evaluated AI-assisted pipelines for</text><text x="34.0" y="205.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8792A2" text-anchor="start">bi-temporal satellite imagery, covering change</text><text x="34.0" y="221.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8792A2" text-anchor="start">detection, change captioning, benchmarking and</text><text x="34.0" y="237.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8792A2" text-anchor="start">retrieval-oriented interpretation.</text><text x="34.0" y="269.0" font-family="Consolas,Liberation Mono,monospace" font-size="9" font-weight="700" fill="#22D3EE" text-anchor="start">Python / PyTorch / Computer Vision</text><rect x="18" y="312" width="354" height="226" rx="6" fill="#0E131B" stroke="#293241"/><path d="M18 360 H372" stroke="#293241"/><text x="34.0" y="341.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="700" fill="#34D399" text-anchor="start">CASE / 02</text><text x="354.0" y="341.0" font-family="Consolas,Liberation Mono,monospace" font-size="8" font-weight="400" fill="#8792A2" text-anchor="end">IN PREPARATION</text><text x="34.0" y="389.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#E8EEF5" text-anchor="start">Enterprise GenAI and Agentic</text><text x="34.0" y="409.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#E8EEF5" text-anchor="start">Automation Exploration</text><text x="34.0" y="439.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8792A2" text-anchor="start">Explored enterprise LLM, RAG, conversational-</text><text x="34.0" y="455.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8792A2" text-anchor="start">assistant and agentic workflow use cases through</text><text x="34.0" y="471.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8792A2" text-anchor="start">value, feasibility, reliability, governance and</text><text x="34.0" y="487.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8792A2" text-anchor="start">human-approval considerations.</text><text x="34.0" y="519.0" font-family="Consolas,Liberation Mono,monospace" font-size="9" font-weight="700" fill="#34D399" text-anchor="start">Azure OpenAI / Copilot Studio / RAG</text><rect x="18" y="562" width="354" height="226" rx="6" fill="#0E131B" stroke="#293241"/><path d="M18 610 H372" stroke="#293241"/><text x="34.0" y="591.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="start">CASE / 03</text><text x="354.0" y="591.0" font-family="Consolas,Liberation Mono,monospace" font-size="8" font-weight="400" fill="#8792A2" text-anchor="end">IN PREPARATION</text><text x="34.0" y="639.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#E8EEF5" text-anchor="start">Glottal Area Segmentation Using</text><text x="34.0" y="659.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#E8EEF5" text-anchor="start">Deep Learning</text><text x="34.0" y="689.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8792A2" text-anchor="start">Implemented a U-Net-based segmentation workflow in</text><text x="34.0" y="705.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8792A2" text-anchor="start">PyTorch using the BAGLS benchmark and reproducible</text><text x="34.0" y="721.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8792A2" text-anchor="start">model-evaluation practices.</text><text x="34.0" y="769.0" font-family="Consolas,Liberation Mono,monospace" font-size="9" font-weight="700" fill="#FBBF24" text-anchor="start">Python / PyTorch / U-Net</text><rect x="18" y="812" width="354" height="226" rx="6" fill="#0E131B" stroke="#293241"/><path d="M18 860 H372" stroke="#293241"/><text x="34.0" y="841.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="700" fill="#FB7185" text-anchor="start">CASE / 04</text><text x="354.0" y="841.0" font-family="Consolas,Liberation Mono,monospace" font-size="8" font-weight="400" fill="#8792A2" text-anchor="end">IN PREPARATION</text><text x="34.0" y="889.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#E8EEF5" text-anchor="start">Solar Panel Fault Classification</text><text x="34.0" y="919.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8792A2" text-anchor="start">Fine-tuned a ResNet50 model for solar-panel fault</text><text x="34.0" y="935.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8792A2" text-anchor="start">classification and framed the solution as an AI-</text><text x="34.0" y="951.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8792A2" text-anchor="start">assisted inspection and predictive-maintenance use</text><text x="34.0" y="967.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8792A2" text-anchor="start">case.</text><text x="34.0" y="1019.0" font-family="Consolas,Liberation Mono,monospace" font-size="9" font-weight="700" fill="#FB7185" text-anchor="start">Python / PyTorch / ResNet50</text></svg>