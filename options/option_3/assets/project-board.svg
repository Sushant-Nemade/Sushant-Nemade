<svg xmlns="http://www.w3.org/2000/svg" role="img" width="100%" viewBox="0 0 900 590" preserveAspectRatio="xMidYMid meet"><title>Selected work system board</title><desc>Four sanitized professional case studies, each marked as in preparation until a public repository is available.</desc><rect width="900" height="590" rx="8" fill="#080B10" stroke="#293241"/><path d="M1 46 H899" stroke="#293241"/><circle cx="20" cy="23" r="4" fill="#FB7185"/><circle cx="36" cy="23" r="4" fill="#FBBF24"/><circle cx="52" cy="23" r="4" fill="#34D399"/><style>.boot{opacity:1;animation:boot .45s ease-out both}.d1{animation-delay:.2s}.d2{animation-delay:.4s}.d3{animation-delay:.6s}.cursor{opacity:1;animation:blink 1.1s steps(2,end) infinite}.module{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}.m2{animation-delay:.5s}.m3{animation-delay:1s}.m4{animation-delay:1.5s}.m5{animation-delay:2s}.scan{animation:scan 7s linear infinite}@keyframes boot{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes blink{50%{opacity:.15}}@keyframes breathe{0%,100%{opacity:.82}50%{opacity:1}}@keyframes scan{from{transform:translateY(0)}to{transform:translateY(430px)}}@media(prefers-reduced-motion:reduce){.boot,.cursor,.module,.scan{animation:none}.moving{display:none}}</style><text x="76.0" y="28.0" font-family="Consolas,Liberation Mono,monospace" font-size="11" font-weight="400" fill="#8792A2" text-anchor="start">systems-console / selected-work</text><rect x="24" y="68" width="414" height="226" rx="6" fill="#0E131B" stroke="#293241"/><path d="M24 116 H438" stroke="#293241"/><text x="42.0" y="97.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="700" fill="#22D3EE" text-anchor="start">CASE / 01</text><text x="418.0" y="97.0" font-family="Consolas,Liberation Mono,monospace" font-size="9" font-weight="400" fill="#8792A2" text-anchor="end">IN PREPARATION</text><text x="42.0" y="146.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#E8EEF5" text-anchor="start">Urban Change Detection and Change</text><text x="42.0" y="168.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#E8EEF5" text-anchor="start">Captioning</text><text x="42.0" y="202.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8792A2" text-anchor="start">Designed and evaluated AI-assisted pipelines for bi-</text><text x="42.0" y="219.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8792A2" text-anchor="start">temporal satellite imagery, covering change detection,</text><text x="42.0" y="236.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8792A2" text-anchor="start">change captioning, benchmarking and retrieval-oriented</text><text x="42.0" y="272.0" font-family="Consolas,Liberation Mono,monospace" font-size="9" font-weight="700" fill="#22D3EE" text-anchor="start">Python / PyTorch / Computer Vision / Model Benchmarking</text><rect x="462" y="68" width="414" height="226" rx="6" fill="#0E131B" stroke="#293241"/><path d="M462 116 H876" stroke="#293241"/><text x="480.0" y="97.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="700" fill="#34D399" text-anchor="start">CASE / 02</text><text x="856.0" y="97.0" font-family="Consolas,Liberation Mono,monospace" font-size="9" font-weight="400" fill="#8792A2" text-anchor="end">IN PREPARATION</text><text x="480.0" y="146.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#E8EEF5" text-anchor="start">Enterprise GenAI and Agentic Automation</text><text x="480.0" y="168.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#E8EEF5" text-anchor="start">Exploration</text><text x="480.0" y="202.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8792A2" text-anchor="start">Explored enterprise LLM, RAG, conversational-assistant and</text><text x="480.0" y="219.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8792A2" text-anchor="start">agentic workflow use cases through value, feasibility,</text><text x="480.0" y="236.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8792A2" text-anchor="start">reliability, governance and human-approval considerations.</text><text x="480.0" y="272.0" font-family="Consolas,Liberation Mono,monospace" font-size="9" font-weight="700" fill="#34D399" text-anchor="start">Azure OpenAI / Copilot Studio / RAG / Prompt Engineering</text><rect x="24" y="320" width="414" height="226" rx="6" fill="#0E131B" stroke="#293241"/><path d="M24 368 H438" stroke="#293241"/><text x="42.0" y="349.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="start">CASE / 03</text><text x="418.0" y="349.0" font-family="Consolas,Liberation Mono,monospace" font-size="9" font-weight="400" fill="#8792A2" text-anchor="end">IN PREPARATION</text><text x="42.0" y="398.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#E8EEF5" text-anchor="start">Glottal Area Segmentation Using Deep</text><text x="42.0" y="420.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#E8EEF5" text-anchor="start">Learning</text><text x="42.0" y="454.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8792A2" text-anchor="start">Implemented a U-Net-based segmentation workflow in PyTorch</text><text x="42.0" y="471.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8792A2" text-anchor="start">using the BAGLS benchmark and reproducible model-</text><text x="42.0" y="488.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8792A2" text-anchor="start">evaluation practices.</text><text x="42.0" y="524.0" font-family="Consolas,Liberation Mono,monospace" font-size="9" font-weight="700" fill="#FBBF24" text-anchor="start">Python / PyTorch / U-Net / Computer Vision</text><rect x="462" y="320" width="414" height="226" rx="6" fill="#0E131B" stroke="#293241"/><path d="M462 368 H876" stroke="#293241"/><text x="480.0" y="349.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="700" fill="#FB7185" text-anchor="start">CASE / 04</text><text x="856.0" y="349.0" font-family="Consolas,Liberation Mono,monospace" font-size="9" font-weight="400" fill="#8792A2" text-anchor="end">IN PREPARATION</text><text x="480.0" y="398.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#E8EEF5" text-anchor="start">Solar Panel Fault Classification</text><text x="480.0" y="432.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8792A2" text-anchor="start">Fine-tuned a ResNet50 model for solar-panel fault</text><text x="480.0" y="449.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8792A2" text-anchor="start">classification and framed the solution as an AI-assisted</text><text x="480.0" y="466.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8792A2" text-anchor="start">inspection and predictive-maintenance use case.</text><text x="480.0" y="524.0" font-family="Consolas,Liberation Mono,monospace" font-size="9" font-weight="700" fill="#FB7185" text-anchor="start">Python / PyTorch / ResNet50 / Computer Vision</text><text x="450.0" y="573.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="400" fill="#8792A2" text-anchor="middle">VERIFIED DESCRIPTIONS / PUBLIC LINKS ADDED ONLY WHEN READY</text></svg>