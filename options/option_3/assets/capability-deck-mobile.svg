<svg xmlns="http://www.w3.org/2000/svg" role="img" width="100%" viewBox="0 0 390 690" preserveAspectRatio="xMidYMid meet"><title>Mobile capability command deck</title><desc>Six readable capability groups arranged vertically for narrow screens.</desc><rect width="390" height="690" rx="8" fill="#080B10" stroke="#293241"/><path d="M1 46 H389" stroke="#293241"/><circle cx="20" cy="23" r="4" fill="#FB7185"/><circle cx="36" cy="23" r="4" fill="#FBBF24"/><circle cx="52" cy="23" r="4" fill="#34D399"/><style>.boot{opacity:1;animation:boot .45s ease-out both}.d1{animation-delay:.2s}.d2{animation-delay:.4s}.d3{animation-delay:.6s}.cursor{opacity:1;animation:blink 1.1s steps(2,end) infinite}.module{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}.m2{animation-delay:.5s}.m3{animation-delay:1s}.m4{animation-delay:1.5s}.m5{animation-delay:2s}.scan{animation:scan 7s linear infinite}@keyframes boot{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes blink{50%{opacity:.15}}@keyframes breathe{0%,100%{opacity:.82}50%{opacity:1}}@keyframes scan{from{transform:translateY(0)}to{transform:translateY(430px)}}@media(prefers-reduced-motion:reduce){.boot,.cursor,.module,.scan{animation:none}.moving{display:none}}</style><text x="76.0" y="28.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="400" fill="#8792A2" text-anchor="start">systems-console / capabilities</text><rect x="18" y="62" width="354" height="82" rx="5" fill="#0E131B" stroke="#293241"/><rect x="18" y="62" width="5" height="82" rx="2" fill="#22D3EE"/><text x="38.0" y="90.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="700" fill="#22D3EE" text-anchor="start">LANGUAGES</text><text x="38.0" y="119.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#E8EEF5" text-anchor="start">Python / SQL</text><text x="352.0" y="90.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="400" fill="#8792A2" text-anchor="end">01</text><rect x="18" y="163" width="354" height="82" rx="5" fill="#0E131B" stroke="#293241"/><rect x="18" y="163" width="5" height="82" rx="2" fill="#34D399"/><text x="38.0" y="191.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="700" fill="#34D399" text-anchor="start">AI_ML</text><text x="38.0" y="220.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#E8EEF5" text-anchor="start">PyTorch / Scikit-learn / Computer Vision</text><text x="352.0" y="191.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="400" fill="#8792A2" text-anchor="end">02</text><rect x="18" y="264" width="354" height="82" rx="5" fill="#0E131B" stroke="#293241"/><rect x="18" y="264" width="5" height="82" rx="2" fill="#FBBF24"/><text x="38.0" y="292.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="start">GENAI</text><text x="38.0" y="321.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#E8EEF5" text-anchor="start">Azure OpenAI / RAG / Copilot Studio</text><text x="352.0" y="292.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="400" fill="#8792A2" text-anchor="end">03</text><rect x="18" y="365" width="354" height="82" rx="5" fill="#0E131B" stroke="#293241"/><rect x="18" y="365" width="5" height="82" rx="2" fill="#FB7185"/><text x="38.0" y="393.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="700" fill="#FB7185" text-anchor="start">ANALYTICS</text><text x="38.0" y="422.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#E8EEF5" text-anchor="start">Power BI / Pandas / Snowflake</text><text x="352.0" y="393.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="400" fill="#8792A2" text-anchor="end">04</text><rect x="18" y="466" width="354" height="82" rx="5" fill="#0E131B" stroke="#293241"/><rect x="18" y="466" width="5" height="82" rx="2" fill="#22D3EE"/><text x="38.0" y="494.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="700" fill="#22D3EE" text-anchor="start">AUTOMATE</text><text x="38.0" y="523.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#E8EEF5" text-anchor="start">Power Apps / Power Automate</text><text x="352.0" y="494.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="400" fill="#8792A2" text-anchor="end">05</text><rect x="18" y="567" width="354" height="82" rx="5" fill="#0E131B" stroke="#293241"/><rect x="18" y="567" width="5" height="82" rx="2" fill="#34D399"/><text x="38.0" y="595.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="700" fill="#34D399" text-anchor="start">DELIVERY</text><text x="38.0" y="624.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#E8EEF5" text-anchor="start">Git / MLflow / CI/CD</text><text x="352.0" y="595.0" font-family="Consolas,Liberation Mono,monospace" font-size="10" font-weight="400" fill="#8792A2" text-anchor="end">06</text></svg>