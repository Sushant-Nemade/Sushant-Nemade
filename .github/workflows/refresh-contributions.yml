name: Refresh Contribution Graph

on:
  workflow_dispatch:
  schedule:
    # Runs once daily at a non-round UTC minute to avoid GitHub Actions'
    # documented congestion around round hours/minutes.
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-contributions
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch, render, and commit contribution data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install daily dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements-daily.txt
          pip install "pytest>=8,<10"

      - name: Run non-image test suite
        run: python -m pytest -q --ignore=tests/test_portrait_renderer.py

      - name: Fetch and validate public contribution data
        run: python -m tools.pull_contributions

      - name: Render contribution graph
        run: python -m tools.render_graph

      - name: Validate rendered graph SVG
        run: python -m tools.validate_svg assets/contribution-graph.svg

      - name: Commit and push changes, if any
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add assets/contributions.json assets/contribution-graph.svg
          if git diff --cached --quiet; then
            echo "No contribution data changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh contribution data [skip ci]"
          git push
