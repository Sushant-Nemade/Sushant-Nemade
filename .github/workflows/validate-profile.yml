name: Validate Profile

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate configuration, assets, and README
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r tools/requirements-daily.txt
          pip install -r tools/requirements-art.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Validate configuration (config/profile.json, config/theme.json)
        run: python -m tools.config

      - name: Validate checked-in contribution data
        run: |
          python -c "
          import json
          import sys
          from tools.pull_contributions import is_valid_document

          with open('assets/contributions.json', encoding='utf-8') as handle:
              document = json.load(handle)

          if not is_valid_document(document):
              print('assets/contributions.json failed validation', file=sys.stderr)
              sys.exit(1)
          print('OK: assets/contributions.json')
          "

      - name: Validate generated SVG assets
        run: |
          python -m tools.validate_svg assets/sysinfo.svg assets/contribution-graph.svg
          if [ -f assets/portrait.svg ]; then
            python -m tools.validate_svg assets/portrait.svg
          else
            echo "assets/portrait.svg not present yet (portrait pipeline is pending a source photo); skipping."
          fi

      - name: Validate README.md
        run: python -m tools.validate_readme

      - name: Ensure no private source photo is tracked by git
        run: |
          if git ls-files --error-unmatch private/source-photo.jpg 2>/dev/null; then
            echo "private/source-photo.jpg must never be committed to the repository" >&2
            exit 1
          fi
          echo "OK: private/source-photo.jpg is not tracked"

      - name: Scan repository text for forbidden or unresolved content
        run: |
          python -c "
          import re
          import sys
          from pathlib import Path

          from tools.config import FORBIDDEN_METRIC_TERMS, FORBIDDEN_TITLES, PHONE_LIKE_PATTERN

          text_files = [
              Path('README.md'),
              Path('IMPLEMENTATION_STATUS.md'),
              Path('config/profile.json'),
          ]
          problems = []
          for file_path in text_files:
              if not file_path.is_file():
                  continue
              content = file_path.read_text(encoding='utf-8')
              lowered = content.lower()
              for term in FORBIDDEN_METRIC_TERMS:
                  if term in lowered:
                      problems.append(f'{file_path}: forbidden unverified metric {term!r}')
              for title in FORBIDDEN_TITLES:
                  if title in lowered:
                      problems.append(f'{file_path}: forbidden job title {title!r}')
              if PHONE_LIKE_PATTERN.search(content):
                  problems.append(f'{file_path}: phone-number-like content present')

          if problems:
              for problem in problems:
                  print(f'FAIL: {problem}', file=sys.stderr)
              sys.exit(1)
          print('OK: no forbidden content found')
          "
