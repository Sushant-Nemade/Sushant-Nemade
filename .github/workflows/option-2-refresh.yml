name: Option 2 - Refresh Public Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: option-2-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Refresh public contribution and repository data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m tools.pull_contributions
          python -m tools.render_graph
          python -m options.option_2.scripts.fetch_public_repos

      - name: Render and validate Option 2 without private portrait source
        run: |
          python -m options.option_2.scripts.render_assets --skip-portrait
          python -m options.option_2.scripts.validate_profile
          python -m pytest -q tests/test_option2.py

      - name: Commit refreshed public assets
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add assets/contributions.json assets/contribution-graph.svg
          git add options/option_2/public-repos.json options/option_2/assets
          if git diff --cached --quiet; then
            echo "No public profile data changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh option 2 public data [skip ci]"
          git push